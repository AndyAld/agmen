[package]
name = "s2-rumqttc"
description = "Spike S2: MQTT 5 client session, ack, reconnect and WSS behavior against the dev EMQX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false }
rumqttc-next = { version = "0.34.0", default-features = false, features = ["websocket", "use-rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
