[package]
name = "s1-emqx"
description = "Spike S1: EMQX JWT identity and ACL tests against the dev broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
async-tungstenite = { version = "0.29", default-features = false, features = ["tokio-runtime"] }
bytes = "1.12.1"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false }
rumqttc = { version = "0.25.1", default-features = false, features = ["websocket"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util", "process"] }
tokio-rustls = "0.26.6"
