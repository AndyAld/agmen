[package]
name = "s7-listener"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs"] }

[dev-dependencies]
rmcp = { version = "3.7.0", features = ["client"] }
tempfile = "3.27.0"
