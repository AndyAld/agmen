# Integration tests are named it_* and need the dev stack (deploy/dev).
# The filter is on test names, not binary names: nextest rejects a binary()
# filter that matches no binary, which breaks the gate until the first
# tests/it_*.rs file exists.

[profile.default]
default-filter = "not test(/(^|::)it_/)"

# Integration tests whose name contains "restart" restart the dev EMQX,
# which would drop every other test's connection, so they run only under
# the it-restart profile below, one at a time.
[profile.it]
default-filter = "test(/(^|::)it_/) and not test(/restart/)"
slow-timeout = { period = "30s", terminate-after = 4 }
test-threads = 4

[profile.it-restart]
default-filter = "test(/(^|::)it_/) and test(/restart/)"
slow-timeout = { period = "60s", terminate-after = 3 }
test-threads = 1
