# Integration tests are named it_* and need the dev stack (deploy/dev).
# Paid model tests are named live_model_* and run only under the live profile.
# The filter is on test names, not binary names: nextest rejects a binary()
# filter that matches no binary, which breaks the gate until the first
# tests/it_*.rs file exists.

[profile.default]
default-filter = "not test(/(^|::)(it|live_model)_/)"

[profile.live]
default-filter = "test(/(^|::)live_model_/)"
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }
test-threads = 1

# Forty bounded turns per model in one capped process, two models total.
# Allow both turn deadlines and process shutdown; never retry paid tests.
[[profile.live.overrides]]
filter = "test(=live_model_triage_accuracy)"
slow-timeout = { period = "60s", terminate-after = 247 }

# Six injection turns and the runtime probes also share capped processes.
[[profile.live.overrides]]
filter = "test(/^live_model_/) and not test(=live_model_triage_accuracy)"
slow-timeout = { period = "60s", terminate-after = 25 }

# Integration tests whose name contains "restart" restart the dev EMQX,
# which would drop every other test's connection, so they run only under
# the it-restart profile below, one at a time.
[profile.it]
default-filter = "test(/(^|::)it_/) and not test(/restart/)"
slow-timeout = { period = "30s", terminate-after = 4 }
test-threads = 4

# Integration tests whose name contains "toxiproxy", and agmen-client's
# it_gap_filled_by_replay, cut or slow the shared toxiproxy link
# (localhost:21883 to emqx:1883), so they run one at a time. So do
# agmen-e2e's tests, because one of them cuts the link too. Tests that
# connect to EMQX directly are not affected and run alongside.
[test-groups]
serial = { max-threads = 1 }

[[profile.it.overrides]]
filter = "test(/toxiproxy/) | test(=it_gap_filled_by_replay) | package(agmen-e2e)"
test-group = "serial"

[profile.it-restart]
default-filter = "test(/(^|::)it_/) and test(/restart/)"
slow-timeout = { period = "60s", terminate-after = 3 }
test-threads = 1
