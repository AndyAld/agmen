# Ingress for the API and MQTT over WebSocket, with a cert-manager
# certificate per host. The ingress class, the ClusterIssuer and both hosts
# are set from placeholders.yaml; the values here are overwritten. Nothing
# here is specific to one ingress controller: add your controller's
# annotations in a component (examples/haproxy-ingress has HAProxy's). The
# EMQX dashboard and REST API (18083) and plain MQTT (1883) get no ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agmen-api
  namespace: agmen
  annotations:
    cert-manager.io/cluster-issuer: placeholder-cluster-issuer
spec:
  ingressClassName: placeholder-ingress-class
  rules:
    - host: api.agmen.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agmen-hub
                port:
                  number: 8080
  tls:
    - hosts:
        - api.agmen.example
      secretName: agmen-api-tls
---
# MQTT over WebSocket to EMQX 8083, path /mqtt. Clients send a keep-alive
# every 30 s (ADR-0003), so the controller's idle timeout for this
# WebSocket must be longer than 30 s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agmen-mqtt-ws
  namespace: agmen
  annotations:
    cert-manager.io/cluster-issuer: placeholder-cluster-issuer
spec:
  ingressClassName: placeholder-ingress-class
  rules:
    - host: mqtt-ws.agmen.example
      http:
        paths:
          - path: /mqtt
            pathType: Prefix
            backend:
              service:
                name: agmen-emqx
                port:
                  number: 8083
  tls:
    - hosts:
        - mqtt-ws.agmen.example
      secretName: agmen-mqtt-ws-tls
