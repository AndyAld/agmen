# Nightly pg_dump of the agmen database to agmen's S3 bucket (Ceph RGW),
# at 03:00 Mountain time. timeZone is set explicitly so the schedule does
# not depend on the controller's zone (CronJob timeZone is GA since
# Kubernetes 1.27). The dump runs in an init container with the server's
# own pg_dump version; the upload runs after it, so a failed dump uploads
# nothing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agmen-pg-dump
  namespace: agmen
  labels:
    app.kubernetes.io/name: pg-dump
    app.kubernetes.io/part-of: agmen
spec:
  schedule: "0 3 * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-dump
            app.kubernetes.io/part-of: agmen
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: postgres:16.15
              command:
                - sh
                - -c
                - exec pg_dump --format=custom --no-owner --file=/backup/agmen.dump
              env:
                - name: PGHOST
                  value: agmen-postgres
                - name: PGDATABASE
                  value: agmen
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: agmen-postgres
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: agmen-postgres
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.38.5
              command:
                - sh
                - -c
                - >-
                  exec aws --endpoint-url "$S3_ENDPOINT" s3 cp /backup/agmen.dump
                  "s3://$S3_BUCKET/postgres/agmen-$(date -u +%Y%m%dT%H%M%SZ).dump"
              envFrom:
                - secretRef:
                    name: agmen-backup-s3
              env:
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                # Ceph RGW may not accept the checksums newer AWS CLIs send
                # by default; send them only when the API requires one.
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
