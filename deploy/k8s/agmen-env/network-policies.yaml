# Limit who can reach Postgres and EMQX inside the cluster. Traffic on
# these ports is plaintext, so only the pods that need it may connect.
# Probes are exec probes and kubectl port-forward runs inside the pod, so
# neither needs a rule. Takes effect only if the cluster's network plugin
# enforces NetworkPolicy (README.md "Cluster requirements").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agmen-postgres
  namespace: agmen
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: agmen
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agmen-hub
              app.kubernetes.io/part-of: agmen
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pg-dump
              app.kubernetes.io/part-of: agmen
      ports:
        - protocol: TCP
          port: 5432
---
# Plain MQTT (1883) and the REST API (18083) are for the hub only. MQTT
# over WebSocket (8083) stays open, since the ingress controller runs in
# a namespace these manifests do not know.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agmen-emqx
  namespace: agmen
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: emqx
      app.kubernetes.io/part-of: agmen
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agmen-hub
              app.kubernetes.io/part-of: agmen
      ports:
        - protocol: TCP
          port: 1883
        - protocol: TCP
          port: 18083
    - ports:
        - protocol: TCP
          port: 8083
