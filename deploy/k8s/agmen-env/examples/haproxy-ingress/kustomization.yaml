# Annotations for the HAProxy Kubernetes Ingress Controller (haproxytech,
# which reads haproxy.org/*). Set ingress-class in placeholders.yaml to
# its class as well. Add it to a kustomization as
#   components:
#     - <path to agmen-env>/examples/haproxy-ingress
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /metadata/annotations/haproxy.org~1ssl-redirect
        value: "true"
  # Clients send a keep-alive every 30 s (ADR-0003); one hour leaves a
  # wide margin.
  - target:
      kind: Ingress
      name: agmen-mqtt-ws
    patch: |-
      - op: add
        path: /metadata/annotations/haproxy.org~1timeout-tunnel
        value: 1h
