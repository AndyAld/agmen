apiVersion: v1
kind: Service
metadata:
  name: agmen-postgres
  namespace: agmen
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agmen
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agmen
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agmen-postgres
  namespace: agmen
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agmen
spec:
  serviceName: agmen-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: agmen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: agmen
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's postgres user.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: agmen-postgres
          env:
            # A subdirectory, since the volume root holds lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", 'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Set storageClassName to agmen's Ceph RBD class once the cluster
        # exists; unset, the claim takes the cluster's default class.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
