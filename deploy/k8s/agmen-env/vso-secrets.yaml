# Secrets come from agmen's own Vault (or OpenBao) through the Vault Secrets
# Operator. Nothing secret is in git. The Vault address, auth mount and role
# are placeholders until agmen's Vault exists; README.md lists the paths and
# keys to create.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agmen-vso
  namespace: agmen
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: agmen-vault
  namespace: agmen
spec:
  address: https://vault.agmen.example
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: agmen-vault
  namespace: agmen
spec:
  vaultConnectionRef: agmen-vault
  method: kubernetes
  mount: kubernetes-agmen
  kubernetes:
    role: agmen
    serviceAccount: agmen-vso
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
# Postgres superuser for the agmen database. The postgres image reads these
# only when it creates the data directory, so a password changed in Vault
# later must also be changed in the database (README.md).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agmen-postgres
  namespace: agmen
spec:
  vaultAuthRef: agmen-vault
  mount: secret
  type: kv-v2
  path: agmen/postgres
  refreshAfter: 1h
  destination:
    name: agmen-postgres
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - username
        - password
      templates:
        POSTGRES_USER:
          text: "{{ .Secrets.username }}"
        POSTGRES_PASSWORD:
          text: "{{ .Secrets.password }}"
        POSTGRES_DB:
          text: agmen
  rolloutRestartTargets:
    - kind: StatefulSet
      name: agmen-postgres
---
# The same credentials as the hub's database URL. The password goes into a
# URL unescaped, so it must be URL safe (README.md).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agmen-hub-database
  namespace: agmen
spec:
  vaultAuthRef: agmen-vault
  mount: secret
  type: kv-v2
  path: agmen/postgres
  refreshAfter: 1h
  destination:
    name: agmen-hub-database
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - username
        - password
      templates:
        AGMEN_DATABASE_URL:
          text: "postgres://{{ .Secrets.username }}:{{ .Secrets.password }}@agmen-postgres:5432/agmen?sslmode=disable"
  rolloutRestartTargets:
    - kind: Deployment
      name: agmen-hub
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agmen-hub-github
  namespace: agmen
spec:
  vaultAuthRef: agmen-vault
  mount: secret
  type: kv-v2
  path: agmen/github
  refreshAfter: 1h
  destination:
    name: agmen-hub-github
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - client_id
        - client_secret
      templates:
        AGMEN_GITHUB_CLIENT_ID:
          text: "{{ .Secrets.client_id }}"
        AGMEN_GITHUB_CLIENT_SECRET:
          text: "{{ .Secrets.client_secret }}"
  rolloutRestartTargets:
    - kind: Deployment
      name: agmen-hub
---
# The hub's EMQX REST API key, as the hub reads it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agmen-hub-emqx-api
  namespace: agmen
spec:
  vaultAuthRef: agmen-vault
  mount: secret
  type: kv-v2
  path: agmen/emqx
  refreshAfter: 1h
  destination:
    name: agmen-hub-emqx-api
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - api_key
        - api_secret
        - dashboard_password
        - node_cookie
      templates:
        AGMEN_EMQX_API_KEY:
          text: "{{ .Secrets.api_key }}"
        AGMEN_EMQX_API_SECRET:
          text: "{{ .Secrets.api_secret }}"
  rolloutRestartTargets:
    - kind: Deployment
      name: agmen-hub
---
# The same API key as EMQX's bootstrap file, plus the dashboard admin
# password and the Erlang node cookie, which would otherwise be the image's
# public defaults.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agmen-emqx
  namespace: agmen
spec:
  vaultAuthRef: agmen-vault
  mount: secret
  type: kv-v2
  path: agmen/emqx
  refreshAfter: 1h
  destination:
    name: agmen-emqx
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - api_key
        - api_secret
        - dashboard_password
        - node_cookie
      templates:
        api-keys.txt:
          text: "{{ .Secrets.api_key }}:{{ .Secrets.api_secret }}:administrator\n"
        EMQX_DASHBOARD__DEFAULT_PASSWORD:
          text: "{{ .Secrets.dashboard_password }}"
        EMQX_NODE__COOKIE:
          text: "{{ .Secrets.node_cookie }}"
  rolloutRestartTargets:
    - kind: StatefulSet
      name: agmen-emqx
---
# The hub's ES256 broker token keys (PKCS#8 PEM). Each Vault key is a file
# name such as agmen-1.pem; the name without .pem is the key id in the JWKS.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agmen-jwt-keys
  namespace: agmen
spec:
  vaultAuthRef: agmen-vault
  mount: secret
  type: kv-v2
  path: agmen/jwt
  refreshAfter: 1h
  destination:
    name: agmen-jwt-keys
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: agmen-hub
---
# Where the nightly pg_dump goes: agmen's own S3 compatible bucket (Ceph RGW).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agmen-backup-s3
  namespace: agmen
spec:
  vaultAuthRef: agmen-vault
  mount: secret
  type: kv-v2
  path: agmen/backup-s3
  refreshAfter: 1h
  destination:
    name: agmen-backup-s3
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - access_key_id
        - secret_access_key
        - endpoint
        - bucket
      templates:
        AWS_ACCESS_KEY_ID:
          text: "{{ .Secrets.access_key_id }}"
        AWS_SECRET_ACCESS_KEY:
          text: "{{ .Secrets.secret_access_key }}"
        S3_ENDPOINT:
          text: "{{ .Secrets.endpoint }}"
        S3_BUCKET:
          text: "{{ .Secrets.bucket }}"
