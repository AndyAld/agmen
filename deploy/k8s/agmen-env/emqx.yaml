# EMQX, one node (docs/adr/0001-dev-stack.md, 0002-broker-emqx.md). One
# replica and no clustering keeps the single-node community terms of the
# BSL license. The config is read-only emqx.conf, never runtime config:
# EMQX lets anonymous clients in when it has no authenticator, and the
# dashboard can delete runtime authenticators. kustomization.yaml makes the
# agmen-emqx-conf ConfigMap from emqx.conf with a hash of its content in
# the name, so a changed emqx.conf changes this pod template and rolls the
# pod. The file is mounted with subPath, which a ConfigMap update alone
# would never reach.
#
# 1883 and 18083 are for the hub inside the cluster only; no ingress
# reaches them. Clients come in on 8083 (WebSocket) through the mqtt-ws
# ingress.
apiVersion: v1
kind: Service
metadata:
  name: agmen-emqx
  namespace: agmen
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/part-of: agmen
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/part-of: agmen
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: ws
      port: 8083
      targetPort: ws
    - name: api
      port: 18083
      targetPort: api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agmen-emqx
  namespace: agmen
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/part-of: agmen
spec:
  serviceName: agmen-emqx
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emqx
      app.kubernetes.io/part-of: agmen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emqx
        app.kubernetes.io/part-of: agmen
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's emqx user.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: emqx
          image: emqx/emqx:6.3.2
          ports:
            - name: mqtt
              containerPort: 1883
            - name: ws
              containerPort: 8083
            - name: api
              containerPort: 18083
          env:
            - name: EMQX_NODE__COOKIE
              valueFrom:
                secretKeyRef:
                  name: agmen-emqx
                  key: EMQX_NODE__COOKIE
            - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agmen-emqx
                  key: EMQX_DASHBOARD__DEFAULT_PASSWORD
          readinessProbe:
            exec:
              command: ["/opt/emqx/bin/emqx", "ctl", "status"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/opt/emqx/bin/emqx", "ctl", "status"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/emqx/data
            - name: conf
              mountPath: /opt/emqx/etc/emqx.conf
              subPath: emqx.conf
              readOnly: true
            - name: api-keys
              mountPath: /opt/emqx/etc/agmen
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: agmen-emqx-conf
        - name: api-keys
          secret:
            secretName: agmen-emqx
            items:
              - key: api-keys.txt
                path: api-keys.txt
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Set storageClassName to agmen's Ceph RBD class once the cluster
        # exists; unset, the claim takes the cluster's default class.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
