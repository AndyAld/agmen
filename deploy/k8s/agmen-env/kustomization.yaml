# The default set: everything agmen runs, with no secret store and no
# ingress controller specific settings. The pods read the Kubernetes
# Secrets that README.md lists; fill them with any secret store, or add
# examples/vso as a component. Build with kubectl kustomize, apply with
# kubectl apply -k.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - placeholders.yaml
  - namespace.yaml
  - postgres.yaml
  - emqx.yaml
  - hub.yaml
  - ingress.yaml
  - network-policies.yaml
  - pg-dump-cronjob.yaml

# The name gets a hash of emqx.conf, so a config change rolls the EMQX pod.
configMapGenerator:
  - name: agmen-emqx-conf
    namespace: agmen
    files:
      - emqx.conf
    options:
      labels:
        app.kubernetes.io/name: emqx
        app.kubernetes.io/part-of: agmen

replacements:
  - source:
      kind: ConfigMap
      name: agmen-placeholders
      fieldPath: data.ingress-class
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.ingressClassName
  - source:
      kind: ConfigMap
      name: agmen-placeholders
      fieldPath: data.cluster-issuer
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - metadata.annotations.[cert-manager.io/cluster-issuer]
  - source:
      kind: ConfigMap
      name: agmen-placeholders
      fieldPath: data.api-host
    targets:
      - select:
          kind: Ingress
          name: agmen-api
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      # The host part of https://<host>.
      - select:
          kind: Deployment
          name: agmen-hub
        fieldPaths:
          - spec.template.spec.containers.[name=hub].env.[name=AGMEN_PUBLIC_URL].value
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: agmen-placeholders
      fieldPath: data.mqtt-ws-host
    targets:
      - select:
          kind: Ingress
          name: agmen-mqtt-ws
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      # The host part of wss://<host>/mqtt.
      - select:
          kind: Deployment
          name: agmen-hub
        fieldPaths:
          - spec.template.spec.containers.[name=hub].env.[name=AGMEN_PUBLIC_MQTT_URL].value
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: agmen-placeholders
      fieldPath: data.hub-image
    targets:
      - select:
          kind: Deployment
          name: agmen-hub
        fieldPaths:
          - spec.template.spec.containers.[name=hub].image
