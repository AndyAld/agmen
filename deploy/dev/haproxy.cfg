# Stands in for the cluster's HAProxy ingress: TLS ends here and plain
# WebSocket goes to EMQX 8083, with the tunnel timeout the cluster sets
# (haproxy.org/timeout-tunnel: "3600s" in dev-env/emqx).
global
  log stdout format raw local0

defaults
  mode http
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout tunnel 3600s

frontend wss
  bind :8443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem
  default_backend emqx_ws

backend emqx_ws
  server emqx emqx:8083
