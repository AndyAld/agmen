# agmen dev stack. Run deploy/dev/init.sh once first.
# Image tags are pinned; see docs/adr/0001-dev-stack.md.
name: agmen-dev

services:
  emqx:
    image: emqx/emqx:6.3.2
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # MQTT over WebSocket, path /mqtt
      - "18083:18083"  # dashboard and REST API
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./.secrets/api-keys.txt:/opt/emqx/etc/agmen/api-keys.txt:ro
      - emqx-data:/opt/emqx/data
    extra_hosts:
      # JWKS comes from the host's port 8090: the jwks service in dev and
      # tests (docs/adr/0002-broker-emqx.md).
      - "host.docker.internal:host-gateway"
    depends_on:
      jwks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Static dev JWKS: the two dev signing keys from init.sh. Outlives every
  # test process, so no test binds 8090 itself.
  jwks:
    image: nginx:1.30.6-alpine
    ports:
      - "8090:8090"
    volumes:
      - ./jwks/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.secrets/jwks:/srv/jwks:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/v1/jwks"]
      interval: 2s
      timeout: 5s
      retries: 30

  # WSS on 8443, terminating TLS in front of EMQX's WebSocket listener.
  haproxy:
    image: haproxy:3.4.7-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./.secrets/haproxy:/usr/local/etc/haproxy/tls:ro
    depends_on:
      emqx:
        condition: service_healthy

  postgres:
    image: postgres:16.15
    env_file: ./.secrets/dev.env
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agmen -d agmen"]
      interval: 2s
      timeout: 5s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8474:8474"    # API
      - "21883:21883"  # proxied MQTT to emqx:1883
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      emqx:
        condition: service_healthy

volumes:
  emqx-data:
  pg-data:
