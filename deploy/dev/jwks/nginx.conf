# Serves the dev JWKS (deploy/dev/.secrets/jwks/jwks.json, written by
# init.sh) at /v1/jwks, the path the hub serves it on. Nothing else.
server {
    listen 8090;

    location = /v1/jwks {
        default_type application/json;
        alias /srv/jwks/jwks.json;
    }

    location / {
        return 404;
    }
}
