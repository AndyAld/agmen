# WSS in front of EMQX's plain WebSocket listener, the way the cluster's
# HAProxy ingress terminates TLS for mqtt-ws.<domain>. The certificate is
# the self-signed one from init.sh (deploy/dev/.secrets/haproxy).
global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    # A WebSocket is a tunnel after the upgrade; MQTT keep-alive pings it.
    timeout tunnel 1h

frontend wss
    bind :8443 ssl crt /usr/local/etc/haproxy/tls/server.pem
    default_backend emqx_ws

backend emqx_ws
    server emqx emqx:8083
