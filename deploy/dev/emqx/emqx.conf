## agmen dev broker. Read-only config: the REST API cannot change these keys.
## Mounted over /opt/emqx/etc/emqx.conf, so the node and cluster blocks stay.

node {
  name = "emqx@127.0.0.1"
  cookie = "agmen-dev-cookie"
  data_dir = "data"
}

cluster {
  name = agmen-dev
  discovery_strategy = manual
}

mqtt {
  ## Envelope max is 64 KiB (protocol 8); leave room for MQTT headers.
  max_packet_size = 96KB
}

## Two authenticators, in order. Neither may ever be removed: with no
## authenticator EMQX lets anonymous clients in.
##
## 1. cinfo binds the client id to the username before any token is read.
##    An identity may connect only as <id>-mcp, <id>-watch or <id>-cli, and
##    the hub only as agmen-hub-<instance>. A match passes the client on
##    (ignore, never allow); anything else is denied. JWT verify_claims cannot
##    do this: it compares a claim for exact equality only (ADR-0002).
## 2. JWT checks the token and binds the username to its sub, so together the
##    two pin all three client ids to one token. on_missing_jwt = deny keeps
##    a client without a token out.
authentication = [
  {
    mechanism = cinfo
    checks = [
      { is_match = "str_eq(clientid, concat([username, '-mcp']))", result = ignore },
      { is_match = "str_eq(clientid, concat([username, '-watch']))", result = ignore },
      { is_match = "str_eq(clientid, concat([username, '-cli']))", result = ignore },
      {
        is_match = ["str_eq(username, 'agmen-hub')", "regex_match(clientid, '^agmen-hub-[a-z0-9]{1,32}$')"]
        result = ignore
      },
      { is_match = "true", result = deny }
    ]
  },
  {
    mechanism = jwt
    use_jwks = true
    endpoint = "http://host.docker.internal:8090/v1/jwks"
    refresh_interval = 60
    from = password
    on_missing_jwt = deny
    disconnect_after_expire = true
    acl_claim_name = acl
    verify_claims { sub = "${username}" }
  }
]

## The token's acl claim is the only source of permissions. Anything it does
## not match is denied.
authorization {
  no_match = deny
  deny_action = ignore
  sources = []
}

## Persistent sessions (clean_start = false with an expiry) and their
## queued QoS 1 messages survive a broker restart. Without this EMQX keeps
## sessions in memory only. Retention matches the clients' 1 day expiry.
durable_sessions {
  enable = true
  message_retention_period = 1d
}

api_key {
  bootstrap_file = "/opt/emqx/etc/agmen/api-keys.txt"
}
