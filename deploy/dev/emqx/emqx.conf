## agmen dev broker. Read-only config: the REST API cannot change these keys.
## Mounted over /opt/emqx/etc/emqx.conf, so the node and cluster blocks stay.

node {
  name = "emqx@127.0.0.1"
  cookie = "agmen-dev-cookie"
  data_dir = "data"
}

cluster {
  name = agmen-dev
  discovery_strategy = manual
}

mqtt {
  ## Envelope max is 64 KiB (protocol 8); leave room for MQTT headers.
  max_packet_size = 96KB
}

## Sessions with an expiry outlive a broker restart (spike S1). Readers
## still replay gaps over HTTP; this only narrows how often they must.
durable_sessions {
  enable = true
}

## JWT is the only authenticator. With no authenticator EMQX lets anonymous
## clients in, so this block must never be empty. on_missing_jwt = deny keeps
## a client without a token out instead of passing it down the chain.
authentication = [
  {
    mechanism = jwt
    use_jwks = true
    endpoint = "http://jwks:8090/v1/jwks"
    refresh_interval = 60
    from = password
    on_missing_jwt = deny
    disconnect_after_expire = true
    acl_claim_name = acl
    ## A token names one identity (sub) and one client id. The hub mints one
    ## token per connection (<id>-mcp, <id>-watch).
    verify_claims {
      sub = "${username}"
      clientid = "${clientid}"
    }
  }
]

## The token's acl claim is the only source of permissions. Anything it does
## not match is denied.
authorization {
  no_match = deny
  deny_action = ignore
  sources = []
}

api_key {
  bootstrap_file = "/opt/emqx/etc/agmen/api-keys.txt"
}
