[workspace]
resolver = "3"
members = [
    "crates/agmen-proto",
    "crates/agmen-local",
    "crates/agmen-roles",
    "crates/agmen-client",
    "crates/agmen-cli",
    "crates/agmen-hub",
    "crates/agmend",
    "tests/e2e",
    "crates/agmen-desktop",
    "spikes/s1-emqx",
    "spikes/s2-rumqttc",
    "spikes/s4-fake-watch",
    "spikes/s5-ds-stall",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "UNLICENSED"
publish = false
repository = "https://git.groupdrive.xyz/groupdrive/agmen"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
too_many_lines = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
