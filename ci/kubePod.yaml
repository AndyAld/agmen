apiVersion: v1
kind: Pod
metadata:
  labels:
    build: agmen
spec:
  serviceAccountName: jenkins-ci
  containers:
    # Builds and tests. Reaches the dev stack in the docker container over the
    # pod's shared localhost.
    - name: rust
      image: rust:1.99.1-bookworm
      command: ["sleep"]
      args: ["infinity"]
      env:
        - name: CARGO_TERM_COLOR
          value: never
      volumeMounts:
        - name: dind-socket
          mountPath: /var/run/dind
      resources:
        requests:
          memory: "8000Mi"
          cpu: "6000m"
        limits:
          memory: "8000Mi"
          cpu: "6000m"
    # Runs the EMQX, Postgres and Toxiproxy dev stack for integration tests.
    # dockerd also listens on a socket shared with the rust container, so
    # the it-restart tests there can run docker compose restart emqx.
    - name: docker
      image: docker:29.9.2-dind
      command: ["dockerd"]
      args:
        - --host=unix:///var/run/docker.sock
        - --host=unix:///var/run/dind/docker.sock
      tty: true
      volumeMounts:
        - name: dind-socket
          mountPath: /var/run/dind
      securityContext:
        privileged: true
      resources:
        requests:
          memory: "3000Mi"
          cpu: "2000m"
        limits:
          memory: "3000Mi"
          cpu: "2000m"
    # Claude Code plugin checks (docs/adr/0006-claude-code-plugin.md).
    - name: node
      image: node:24.22.1-bookworm-slim
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests:
          memory: "1000Mi"
          cpu: "1000m"
        limits:
          memory: "1000Mi"
          cpu: "1000m"
  volumes:
    - name: dind-socket
      emptyDir: {}
