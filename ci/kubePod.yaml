apiVersion: v1
kind: Pod
metadata:
  labels:
    build: agmen
spec:
  serviceAccountName: jenkins-ci
  containers:
    # Builds and tests. Reaches the dev stack in the docker container over the
    # pod's shared localhost.
    - name: rust
      image: rust:1.99.1-bookworm
      command: ["sleep"]
      args: ["infinity"]
      env:
        - name: CARGO_TERM_COLOR
          value: never
        # Spike S1 restarts the broker with docker compose; the CLI comes from
        # the docker container through the shared volume.
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
        - name: PATH
          value: /var/run/ci-bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: DOCKER_CONFIG
          value: /var/run/ci-docker
      volumeMounts:
        - name: docker-run
          mountPath: /var/run
      resources:
        requests:
          memory: "8000Mi"
          cpu: "6000m"
        limits:
          memory: "8000Mi"
          cpu: "6000m"
    # Runs the EMQX, Postgres and Toxiproxy dev stack for integration tests.
    - name: docker
      image: docker:29.9.2-dind
      command: ["dockerd"]
      tty: true
      securityContext:
        privileged: true
      volumeMounts:
        - name: docker-run
          mountPath: /var/run
      resources:
        requests:
          memory: "3000Mi"
          cpu: "2000m"
        limits:
          memory: "3000Mi"
          cpu: "2000m"
  volumes:
    - name: docker-run
      emptyDir: {}
