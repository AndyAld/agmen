[package]
name = "agmen-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agmen-hub"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Hub::seed_project, seed_identity, seed_human and approve_device, for
# integration tests (agmen-client's, the CLI's and the hub's own). Never
# enabled in the hub binary.
test-hooks = []

[dependencies]
agmen-core = { version = "0.1.0", path = "../agmen-core" }
agmen-proto = { version = "0.1.0", path = "../agmen-proto" }
anyhow = "1.0.104"
aws-lc-rs = "1.18.2"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio", "tracing"] }
base64 = "0.23.1"
futures-core = "0.3.34"
getrandom = "0.4.3"
globset = "0.4.20"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
# rumqttc-next names its library `rumqttc`, as the upstream rumqttc that the
# tests use does, so this one is renamed (ADR-0003).
rumqttc_next = { version = "0.34.0", package = "rumqttc-next", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
agmen-core = { version = "0.1.0", path = "../agmen-core", features = ["testing"] }
# The hub's own integration tests use the test hooks too; a dev-dependency
# never reaches the hub binary's build.
agmen-hub = { version = "0.1.0", path = ".", features = ["test-hooks"] }
rumqttc = { version = "0.25.1", default-features = false }
rumqttc_next = { version = "0.34.0", package = "rumqttc-next", default-features = false, features = ["websocket"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util"] }
