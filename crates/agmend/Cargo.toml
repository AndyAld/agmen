[package]
name = "agmend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agmend"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agmen-client = { version = "0.1.0", path = "../agmen-client" }
agmen-local = { version = "0.1.0", path = "../agmen-local", features = ["tokio"] }
agmen-proto = { version = "0.1.0", path = "../agmen-proto" }
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
roxmltree = "0.21.2"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "process", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio-stream = "0.1.19"
