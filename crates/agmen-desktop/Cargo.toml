[package]
name = "agmen-desktop"
description = "The agmen desktop app: a GPUI console with Zed's layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agmen-proto = { version = "0.1.0", path = "../agmen-proto" }
anyhow = "1.0.104"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918" }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", version = "0.1.0", features = ["runtime_shaders", "font-kit"] }
notify-rust = { version = "4.18.2", default-features = false }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSImage", "std", "NSImageRep", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSData", "std", "NSGeometry", "NSTimeZone"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["UTType", "std"] }

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", features = ["test-support"] }
tempfile = "3.27.0"
