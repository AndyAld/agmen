[package]
name = "agmen-desktop"
description = "The agmen desktop app: a GPUI console with Zed's layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918" }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", version = "0.1.0", features = ["runtime_shaders", "font-kit"] }

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", features = ["test-support"] }
tempfile = "3.27.0"
