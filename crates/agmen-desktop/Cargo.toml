[package]
name = "agmen-desktop"
description = "The agmen desktop app: a GPUI console with Zed's layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Task 7: the CLI's identity file finder and agmend's socket path. Only
# those synchronous functions are called; no runtime starts.
agmen-client = { version = "0.1.0", path = "../agmen-client" }
# The blocking frame codec only; the tokio feature stays off.
agmen-local = { version = "0.1.0", path = "../agmen-local" }
agmen-proto = { version = "0.1.0", path = "../agmen-proto" }
anyhow = "1.0.104"
base64 = "0.23.1"
flate2 = "1.1.10"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918" }
jiff = "0.2.38"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
roxmltree = "0.21.2"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-md = "0.5.4"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-xml = "0.7.0"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", version = "0.1.0", features = ["runtime_shaders", "font-kit"] }
notify-rust = { version = "4.18.2", default-features = false }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSImage", "std", "NSImageRep", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSData", "std", "NSGeometry"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["UTType", "std"] }

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", features = ["test-support"] }
tempfile = "3.27.0"

# CoreText for tests that need the real shaper, such as right to left text.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", version = "0.1.0", features = ["font-kit"] }
