[package]
name = "agmen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
agmen-proto = { version = "0.1.0", path = "../agmen-proto" }
getrandom = "0.4.3"
globset = "0.4.20"
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
agmen-core = { version = "0.1.0", path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
