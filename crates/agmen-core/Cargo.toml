[package]
name = "agmen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
agmen-proto = { version = "0.1.0", path = "../agmen-proto" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
agmen-core = { version = "0.1.0", path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
